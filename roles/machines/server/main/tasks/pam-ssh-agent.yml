- name: Install pam-ssh-agent
  become: true
  become_user: aur-builder
  kewlfft.aur.aur:
    name: pam-ssh-agent

- name: Configure pam.d/sudo
  ansible.builtin.copy:
    src: pam-sudo
    dest: /etc/pam.d/sudo
    mode: "0644"

- name: Set PAM security directory permissions
  ansible.builtin.file:
    path: /etc/security
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [package-permissions]

- name: Add authorized public ssh-key for sudo
  ansible.posix.authorized_key:
    user: root
    path: /etc/security/authorized_keys
    key: "{{ public_ssh_key }}"
    comment: personal
    manage_dir: false
