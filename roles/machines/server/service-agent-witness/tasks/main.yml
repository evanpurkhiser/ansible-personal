- name: Ensure agent-witness data directory exists
  ansible.builtin.file:
    path: /var/lib/agent-witness
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install agent-witness runtime directory configuration
  ansible.builtin.copy:
    src: agent-witness-tmpfiles.conf
    dest: /etc/tmpfiles.d/agent-witness.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure agent-witness runtime directory exists
  ansible.builtin.file:
    path: /run/agent-witness
    state: directory
    owner: root
    group: users
    mode: "2770"

- name: Install agent-witness config
  notify: Restart agent-witness
  ansible.builtin.copy:
    src: agent-witness.toml
    dest: /etc/agent-witness.toml
    owner: root
    group: root
    mode: "0600"

- name: Ensure agent-witness container
  containers.podman.podman_container:
    name: agent-witness
    image: ghcr.io/evanpurkhiser/agent-witness:latest
    state: present
    publish:
      - "127.0.0.1:9345:9345"
    volume:
      - "/etc/agent-witness.toml:/etc/agent-witness.toml:ro"
      - "/var/lib/agent-witness:/var/lib/agent-witness"
      - "/run/agent-witness:/run/agent-witness"
    label:
      io.containers.autoupdate: registry
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      new: true

- name: Ensure agent-witness container is running
  ansible.builtin.systemd:
    name: container-agent-witness
    state: started
    enabled: true
    daemon_reload: true

- name: Expose agent-witness internally
  notify: Reload nginx
  internal_service:
    name: agent-witness
    local_port: 9345
    expose_ports: [443]
