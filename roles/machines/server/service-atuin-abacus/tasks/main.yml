- name: Ensure atuin-abacus data directory
  ansible.builtin.file:
    path: /var/lib/atuin-abacus
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0700"

- name: Install atuin-abacus environment
  no_log: true
  register: atuin_abacus_config
  ansible.builtin.copy:
    dest: /etc/atuin-abacus.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      HOST=127.0.0.1
      PORT=7071
      ATUIN_SYNC_ADDRESS=http://127.0.0.1:7070
      ATUIN_USERNAME={{ atuin_abacus.username }}
      ATUIN_PASSWORD={{ atuin_abacus.password }}
      ATUIN_ENCRYPTION_KEY={{ atuin_abacus.encryption_key }}
      CACHE_TTL_SECONDS=300
      ATUIN_SYNC_INTERVAL_SECONDS=300
      TZ=America/New_York

- name: Install atuin-abacus Quadlet
  register: atuin_abacus_quadlet
  ansible.builtin.copy:
    src: container-atuin-abacus.container
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure atuin-abacus container is running
  ansible.builtin.systemd:
    name: container-atuin-abacus
    state: >-
      {{ 'restarted' if atuin_abacus_quadlet.changed or atuin_abacus_config.changed else 'started' }}
    daemon_reload: true
