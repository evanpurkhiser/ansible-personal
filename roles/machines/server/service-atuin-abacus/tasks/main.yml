- name: Ensure atuin-abacus data directory
  ansible.builtin.file:
    path: /var/lib/atuin-abacus
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0700"

- name: Install atuin-abacus environment
  no_log: true
  register: atuin_abacus_config
  ansible.builtin.copy:
    dest: /etc/atuin-abacus.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      HOST=127.0.0.1
      PORT=7071
      ATUIN_SYNC_ADDRESS=http://127.0.0.1:7070
      ATUIN_USERNAME={{ atuin_abacus.username }}
      ATUIN_PASSWORD={{ atuin_abacus.password }}
      ATUIN_ENCRYPTION_KEY={{ atuin_abacus.encryption_key }}
      CACHE_TTL_SECONDS=300
      ATUIN_SYNC_INTERVAL_SECONDS=300
      TZ=America/New_York

- name: Ensure atuin-abacus container
  register: atuin_abacus_container
  containers.podman.podman_container:
    name: atuin-abacus
    image: ghcr.io/evanpurkhiser/atuin-abacus:latest
    state: present
    image_strict: true
    recreate: "{{ atuin_abacus_config.changed }}"
    network: host
    volume:
      - /var/lib/atuin-abacus:/var/lib/atuin-abacus
    env_file:
      - /etc/atuin-abacus.conf
    label:
      io.containers.autoupdate: registry
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      new: true
      after:
        - container-atuin-server.service
      requires:
        - container-atuin-server.service

- name: Ensure atuin-abacus container is running
  ansible.builtin.systemd:
    name: container-atuin-abacus
    state: "{{ 'restarted' if atuin_abacus_container.changed else 'started' }}"
    enabled: true
    daemon_reload: true
