- name: Ensure atuin directories
  loop:
    - path: atuin/data
      mode: "0700"
    - path: atuin/config
      mode: "0755"
  ansible.builtin.file:
    path: /var/lib/{{ item.path }}
    state: directory
    mode: "{{ item.mode }}"

- name: Ensure atuin server.toml
  ansible.builtin.copy:
    content: ""
    dest: /var/lib/atuin/config/server.toml
    mode: "0644"

- name: Ensure atuin podman pod
  notify: Restart atuin
  containers.podman.podman_pod:
    name: atuin
    infra_name: atuin-infra
    ports:
      - "127.0.0.1:7070:8888"

- name: Ensure atuin postgres container
  notify: Restart atuin
  containers.podman.podman_container:
    name: atuin-postgres
    image: docker.io/postgres:14
    state: present
    pod: atuin
    volumes:
      - "/var/lib/atuin/data:/var/lib/postgresql/data"
    env:
      POSTGRES_USER: atuin
      POSTGRES_PASSWORD: atuin
      POSTGRES_DB: atuin

- name: Ensure atuin server container
  notify: Restart atuin
  containers.podman.podman_container:
    name: atuin-server
    image: ghcr.io/atuinsh/atuin:18.24.2-1
    state: present
    pod: atuin
    command: start
    volumes:
      - "/var/lib/atuin/config:/config"
    env:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: 8888
      ATUIN_OPEN_REGISTRATION: false
      ATUIN_DB_URI: "postgres://atuin:atuin@localhost/atuin"

- name: Generate atuin systemd services
  notify: Restart atuin
  containers.podman.podman_generate_systemd:
    name: atuin
    dest: /etc/systemd/system
    new: true
    no_header: true
    restart_policy: always

- name: Ensure atuin pod is running
  ansible.builtin.systemd:
    name: pod-atuin
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure atuin containers are running
  loop: [atuin-postgres, atuin-server]
  ansible.builtin.systemd:
    name: container-{{ item }}
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure atuin backup directory on ZFS
  ansible.builtin.file:
    path: /mnt/documents/backups/atuin
    state: directory
    mode: "0755"

- name: Install atuin-backup.sh script
  ansible.builtin.copy:
    src: atuin-backup.sh
    dest: /usr/local/bin/
    mode: "0755"

- name: Configure atuin backup retention
  ansible.builtin.copy:
    src: atuin-backup-tmpfiles.conf
    dest: /etc/tmpfiles.d/atuin-backup.conf
    mode: "0644"

- name: Install atuin-backup timer and service
  notify: Systemd daemon-reload
  loop: [timer, service]
  ansible.builtin.copy:
    src: atuin-backup.{{ item }}
    dest: /etc/systemd/system/
    mode: "0644"

- name: Enable atuin-backup timer service
  ansible.builtin.service:
    name: atuin-backup.timer
    state: started
    enabled: true

- name: Expose atuin internally
  notify: Reload nginx
  internal_service:
    name: atuin
    local_port: 7070
