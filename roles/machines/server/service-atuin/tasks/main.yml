- name: Ensure atuin directories
  loop:
    - path: atuin/data
      mode: "0700"
    - path: atuin/config
      mode: "0755"
  ansible.builtin.file:
    path: /var/lib/{{ item.path }}
    state: directory
    mode: "{{ item.mode }}"

- name: Ensure atuin server.toml
  ansible.builtin.copy:
    content: ""
    dest: /var/lib/atuin/config/server.toml
    mode: "0644"

- name: Install atuin Quadlets
  notify: Restart atuin
  loop:
    - atuin.pod
    - container-atuin-postgres.container
    - container-atuin-server.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure atuin services are running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  loop:
    - pod-atuin.service
    - container-atuin-postgres.service
    - container-atuin-server.service

- name: Ensure atuin backup directory on ZFS
  ansible.builtin.file:
    path: /mnt/documents/backups/atuin
    state: directory
    mode: "0755"

- name: Install atuin-backup.sh script
  ansible.builtin.copy:
    src: atuin-backup.sh
    dest: /usr/local/bin/
    mode: "0755"

- name: Configure atuin backup retention
  ansible.builtin.copy:
    src: atuin-backup-tmpfiles.conf
    dest: /etc/tmpfiles.d/atuin-backup.conf
    mode: "0644"

- name: Install atuin-backup timer and service
  notify: Systemd daemon-reload
  loop: [timer, service]
  ansible.builtin.copy:
    src: atuin-backup.{{ item }}
    dest: /etc/systemd/system/
    mode: "0644"

- name: Enable atuin-backup timer service
  ansible.builtin.service:
    name: atuin-backup.timer
    state: started
    enabled: true

- name: Expose atuin internally
  notify: Reload nginx
  internal_service:
    name: atuin
    local_port: 7070
