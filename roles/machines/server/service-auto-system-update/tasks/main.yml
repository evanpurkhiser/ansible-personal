- name: Ensure system update state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: evan
    group: users
    mode: "0700"
  loop:
    - /home/evan/.local/state/system-updates
    - /home/evan/.local/state/system-updates/runs

- name: Remove legacy auto-system-update config
  ansible.builtin.file:
    path: /etc/auto-system-update.conf
    state: absent

- name: Install auto-system-update prompt
  ansible.builtin.copy:
    src: auto-system-update.prompt
    dest: /etc/auto-system-update.prompt
    mode: "0644"

- name: Install auto-system-update.sh script
  ansible.builtin.copy:
    src: auto-system-update.sh
    dest: /usr/local/bin/
    mode: "0755"

- name: Install auto-system-update timer and service
  ansible.builtin.copy:
    src: auto-system-update.{{ item }}
    dest: /etc/systemd/system/
    mode: "0644"
  with_items: [timer, service]
  notify: Systemd daemon-reload

- name: Enable auto-system-update timer service
  ansible.builtin.service:
    name: auto-system-update.timer
    enabled: true
    state: started
