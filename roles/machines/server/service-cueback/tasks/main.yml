- name: Ensure cueback recordings directory
  ansible.builtin.file:
    path: /mnt/documents/multimedia/djing/cueback
    state: directory
    owner: evan
    group: users
    mode: "0755"

- name: Install cueback configuration
  notify: Restart cueback
  ansible.builtin.copy:
    src: cueback.toml
    dest: /etc/cueback.toml
    owner: root
    group: root
    mode: "0644"

- name: Ensure cueback LAN network
  containers.podman.podman_network:
    name: cueback
    driver: macvlan
    interface_name: lan0
    subnet: 10.0.0.0/24
    gateway: 10.0.0.1
    disable_dns: true

- name: Ensure cueback container
  notify: Restart cueback
  containers.podman.podman_container:
    name: cueback
    image: ghcr.io/evanpurkhiser/cueback:latest
    authfile: /etc/containers/auth.json
    state: present
    network: cueback
    ip: 10.0.0.10
    mac_address: 02:52:42:58:50:02
    user: "1000:100"
    volume:
      - /etc/localtime:/etc/localtime:ro
      - /etc/cueback.toml:/etc/cueback.toml:ro
      - /mnt/documents/multimedia/djing/cueback:/recordings
    label:
      io.containers.autoupdate: registry
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      new: true
      after:
        - mnt-documents.mount
        - network-online.target

- name: Ensure cueback container is running
  ansible.builtin.systemd:
    name: container-cueback
    state: started
    enabled: true
    daemon_reload: true
