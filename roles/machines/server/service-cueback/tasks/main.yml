- name: Ensure cueback recordings directory
  ansible.builtin.file:
    path: /mnt/documents/multimedia/djing/cueback
    state: directory
    owner: evan
    group: users
    mode: "0755"

- name: Install cueback configuration
  notify: Restart cueback
  ansible.builtin.copy:
    src: cueback.toml
    dest: /etc/cueback.toml
    owner: root
    group: root
    mode: "0644"

- name: Install cueback Quadlets
  notify: Restart cueback
  loop:
    - cueback.network
    - container-cueback.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure cueback container is running
  ansible.builtin.systemd:
    name: container-cueback
    state: started
    daemon_reload: true
