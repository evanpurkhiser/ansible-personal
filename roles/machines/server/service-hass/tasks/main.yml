- name: Ensure hass config directory exists
  ansible.builtin.file:
    path: /var/lib/hass
    state: directory
    mode: "0755"

- name: Ensure hass build directory exists
  ansible.builtin.file:
    path: /var/lib/hass/build
    state: directory
    mode: "0755"

- name: Install hass build context
  register: hass_build_context
  ansible.builtin.copy:
    src: build/
    dest: /var/lib/hass/build/
    mode: "0644"

- name: Pull upstream hass image
  register: hass_upstream_image
  containers.podman.podman_image:
    name: ghcr.io/home-assistant/home-assistant:latest
    force: true

- name: Build hass image
  register: hass_image
  containers.podman.podman_image:
    name: localhost/home-assistant:latest
    state: build
    path: /var/lib/hass/build
    force: >-
      {{ hass_upstream_image.changed or hass_build_context.changed }}

# HA's built-in backups land here. Living on the documents ZFS pool means
# zrepl picks them up in the hourly snapshot and replicates them offsite
# with the same retention as the rest of the pool.
- name: Ensure hass backup directory on ZFS
  ansible.builtin.file:
    path: /mnt/documents/backups/home-assistant
    state: directory
    owner: evan
    group: users
    mode: "0755"

- name: Ensure hass configuration
  notify: Restart home-assistant
  ansible.builtin.copy:
    src: home-assistant.yaml
    dest: /var/lib/hass/configuration.yaml
    mode: "0644"

- name: Ensure hass custom ZHA quirks
  notify: Restart home-assistant
  ansible.builtin.copy:
    src: custom_zha_quirks/
    dest: /var/lib/hass/custom_zha_quirks/
    mode: "0644"
    directory_mode: "0755"

- name: Ensure automations file
  ansible.builtin.file:
    path: /var/lib/hass/automations.yaml
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Ensure scripts folder
  ansible.builtin.file:
    path: /var/lib/hass/scripts.yaml
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Ensure hass secrets
  notify: Restart home-assistant
  ansible.builtin.template:
    src: home-assistant-secrets.yaml
    dest: /var/lib/hass/secrets.yaml
    mode: "0644"

- name: Ensure hass podman container
  register: hass_container
  containers.podman.podman_container:
    name: home-assistant
    image: localhost/home-assistant:latest
    state: present
    image_strict: true
    recreate: "{{ hass_image.changed }}"
    network: host
    volume:
      - "/var/lib/hass:/config"
      - "/mnt/documents/backups/home-assistant:/config/backups"
      - "/etc/localtime:/etc/localtime:ro"
    device:
      - "/dev/zwave:/dev/zwave"
      - "/dev/zigbee:/dev/zigbee"
    label:
      io.containers.autoupdate: local
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      after:
        - dev-zwave.device
        - dev-zigbee.device
      new: true

- name: Ensure hass container is running
  ansible.builtin.systemd:
    name: container-home-assistant
    state: "{{ 'restarted' if hass_container.changed else 'started' }}"
    enabled: true
    daemon_reload: true

- name: Expose hass internally
  notify: Reload nginx
  internal_service:
    name: hass
    domain: ha
    local_port: 8123

- name: Expose Home Assistant MCP
  tags: [mcp]
  ansible.builtin.import_role:
    name: machines/server/service-mcp-proxy
  vars:
    mcp_proxy_name: home-assistant
    mcp_proxy_port: 9594
    mcp_proxy_backend:
      url: http://127.0.0.1:9584/private_zbONmPV3vWR6PgcbZCKUHA
