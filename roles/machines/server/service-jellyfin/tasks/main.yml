- name: Ensure jellyfin directories exist
  loop:
    - config
    - cache
  ansible.builtin.file:
    path: /var/lib/jellyfin/{{ item }}
    state: directory
    owner: evan
    group: users
    mode: "0755"

- name: Ensure jellyfin container
  notify: Restart jellyfin
  containers.podman.podman_container:
    name: jellyfin
    image: docker.io/jellyfin/jellyfin:latest
    state: present
    user: "1000:984"
    publish:
      - "127.0.0.1:8096:8096"
    volume:
      - "/var/lib/jellyfin/config:/config"
      - "/var/lib/jellyfin/cache:/cache"
      - "/mnt/documents/multimedia:/media:ro"
      - "/etc/localtime:/etc/localtime:ro"
    env:
      JELLYFIN_PublishedServerUrl: https://jellyfin.prk.network
    label:
      io.containers.autoupdate: registry
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      after: mnt-documents.mount
      new: true

- name: Ensure jellyfin container is running
  ansible.builtin.systemd:
    name: container-jellyfin
    state: started
    enabled: true
    daemon_reload: true

- name: Expose jellyfin internally
  notify: Reload nginx
  internal_service:
    name: jellyfin
    local_port: 8096
