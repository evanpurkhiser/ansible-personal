- name: Ensure jellyfin directories exist
  loop:
    - config
    - cache
  ansible.builtin.file:
    path: /var/lib/jellyfin/{{ item }}
    state: directory
    owner: evan
    group: users
    mode: "0755"

- name: Install jellyfin Quadlet
  notify: Restart jellyfin
  ansible.builtin.copy:
    src: container-jellyfin.container
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure jellyfin container is running
  ansible.builtin.systemd:
    name: container-jellyfin
    state: started
    daemon_reload: true

- name: Expose jellyfin internally
  notify: Reload nginx
  internal_service:
    name: jellyfin
    local_port: 8096
