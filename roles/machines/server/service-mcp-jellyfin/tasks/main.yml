- name: Ensure jellyfin MCP build directory
  ansible.builtin.file:
    path: /var/lib/mcp-jellyfin/build
    state: directory
    mode: "0755"

- name: Install jellyfin MCP build context
  register: mcp_jellyfin_build_context
  ansible.builtin.copy:
    src: build/
    dest: /var/lib/mcp-jellyfin/build/
    mode: "0644"

- name: Build jellyfin MCP image
  containers.podman.podman_image:
    name: localhost/mcp-jellyfin:latest
    state: build
    path: /var/lib/mcp-jellyfin/build
    force: "{{ mcp_proxy_build_context.changed or mcp_jellyfin_build_context.changed }}"

- name: Expose Jellyfin MCP
  ansible.builtin.import_role:
    name: machines/server/service-mcp-proxy
  vars:
    mcp_proxy_name: jellyfin
    mcp_proxy_website_url: https://jellyfin.org
    mcp_proxy_icons:
      - src: icon.png
        sizes: ["144x144"]
    mcp_proxy_port: 9593
    mcp_proxy_image: localhost/mcp-jellyfin:latest
    mcp_proxy_backend:
      command: /usr/local/bin/jellyfin-mcp
    mcp_proxy_environment:
      JELLYFIN_URL: http://127.0.0.1:8096
      JELLYFIN_API_KEY: "{{ mcp.jellyfin_api_key }}"
