- name: Ensure Jellyfin MCP directories exist
  loop:
    - /var/lib/mcp-jellyfin/build
    - /etc/mcp-jellyfin
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Jellyfin MCP image build context
  register: mcp_jellyfin_build_context
  ansible.builtin.copy:
    src: build/
    dest: /var/lib/mcp-jellyfin/build/
    owner: root
    group: root
    mode: "0644"

- name: Build Jellyfin MCP image
  notify: Restart Jellyfin MCP tunnel
  containers.podman.podman_image:
    name: "{{ mcp_jellyfin_image }}"
    state: build
    path: /var/lib/mcp-jellyfin/build
    force: "{{ mcp_jellyfin_build_context.changed }}"
    build:
      force_rm: true
      extra_args: >-
        --build-arg JELLYFIN_MCP_VERSION={{ mcp_jellyfin_version }}
        --build-arg JELLYFIN_MCP_SHA256={{ mcp_jellyfin_sha256 }}
        --build-arg
        TUNNEL_CLIENT_VERSION={{ mcp_jellyfin_tunnel_client_version }}
        --build-arg
        TUNNEL_CLIENT_SHA256={{ mcp_jellyfin_tunnel_client_sha256 }}

- name: Install Jellyfin MCP tunnel environment
  notify: Restart Jellyfin MCP tunnel
  no_log: true
  ansible.builtin.template:
    src: environment.j2
    dest: /etc/mcp-jellyfin/environment
    owner: root
    group: root
    mode: "0600"

- name: Install Jellyfin MCP tunnel profile
  notify: Restart Jellyfin MCP tunnel
  no_log: true
  ansible.builtin.template:
    src: profile.yaml.j2
    dest: /etc/mcp-jellyfin/profile.yaml
    owner: "10001"
    group: "10001"
    mode: "0400"

- name: Ensure Jellyfin MCP tunnel container
  notify: Restart Jellyfin MCP tunnel
  containers.podman.podman_container:
    name: mcp-jellyfin
    image: "{{ mcp_jellyfin_image }}"
    state: present
    network: host
    user: "10001:10001"
    cap_drop: [ALL]
    read_only: true
    env_file:
      - /etc/mcp-jellyfin/environment
    volume:
      - /etc/mcp-jellyfin/profile.yaml:/etc/tunnel-client/profile.yaml:ro
    healthcheck: >-
      wget -qO- http://127.0.0.1:{{ mcp_jellyfin_health_port }}/readyz
      >/dev/null || exit 1
    healthcheck_interval: 30s
    healthcheck_timeout: 5s
    healthcheck_retries: 3
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      new: true

- name: Ensure Jellyfin MCP tunnel is running
  ansible.builtin.systemd:
    name: container-mcp-jellyfin
    state: started
    enabled: true
    daemon_reload: true
