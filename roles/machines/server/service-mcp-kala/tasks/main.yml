- name: Ensure Kala MCP directories
  ansible.builtin.file:
    path: "/var/lib/kala-mcp/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [charts, output, run, state]

- name: Install kala-appliance Quadlet
  register: mcp_kala_quadlet
  ansible.builtin.copy:
    src: container-kala-appliance.container
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure Kala appliance is running
  ansible.builtin.systemd:
    name: container-kala-appliance
    state: "{{ 'restarted' if mcp_kala_quadlet.changed else 'started' }}"
    daemon_reload: true

- name: Expose Kala MCP
  ansible.builtin.import_role:
    name: machines/server/service-mcp-proxy
  vars:
    mcp_proxy_name: kala
    mcp_proxy_port: 9595
    mcp_proxy_backend:
      url: http://localhost/kala-mcp
      socket_path: /run/kala-mcp/kala-mcp.sock
    mcp_proxy_volumes:
      - /var/lib/kala-mcp/run:/run/kala-mcp:ro
    mcp_proxy_upstream_units:
      - container-kala-appliance.service
