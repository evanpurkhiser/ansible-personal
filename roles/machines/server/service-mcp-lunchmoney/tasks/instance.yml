- name: Install Lunch Money MCP environment for {{ mcp_lunchmoney_profile }}
  notify: Restart Lunch Money MCP tunnels
  no_log: true
  ansible.builtin.copy:
    content: |
      CONTROL_PLANE_API_KEY={{ mcp_tunnels.control_plane_api_key }}
      LUNCHMONEY_API_TOKEN={{ mcp_lunchmoney_api_token }}
    dest: "/etc/mcp-lunchmoney/{{ mcp_lunchmoney_profile }}.env"
    owner: root
    group: root
    mode: "0600"

- name: Install Lunch Money MCP profile for {{ mcp_lunchmoney_profile }}
  notify: Restart Lunch Money MCP tunnels
  no_log: true
  ansible.builtin.copy:
    content: |
      config_version: 1
      control_plane:
        tunnel_id: {{ mcp_lunchmoney_tunnel_id | to_json }}
        api_key: "env:CONTROL_PLANE_API_KEY"
      mcp:
        commands:
          - channel: main
            command: "/usr/local/bin/lunchmoney-mcp"
    dest: "/etc/mcp-lunchmoney/{{ mcp_lunchmoney_profile }}.yaml"
    owner: "10001"
    group: "10001"
    mode: "0400"

- name: Ensure Lunch Money MCP tunnel container for {{ mcp_lunchmoney_profile }}
  notify: Restart Lunch Money MCP tunnels
  containers.podman.podman_container:
    name: "mcp-lunchmoney-{{ mcp_lunchmoney_profile }}"
    image: localhost/mcp-lunchmoney:latest
    state: present
    cap_drop: [ALL]
    read_only: true
    env_file:
      - "/etc/mcp-lunchmoney/{{ mcp_lunchmoney_profile }}.env"
    volume:
      - >-
        /etc/mcp-lunchmoney/{{ mcp_lunchmoney_profile }}.yaml:/etc/tunnel-client/profile.yaml:ro
    healthcheck: >-
      curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      new: true

- name: Ensure Lunch Money MCP tunnel is running for {{ mcp_lunchmoney_profile }}
  ansible.builtin.systemd:
    name: "container-mcp-lunchmoney-{{ mcp_lunchmoney_profile }}"
    state: started
    enabled: true
    daemon_reload: true
