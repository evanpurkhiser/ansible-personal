- name: Ensure lunchmoney MCP build directory
  ansible.builtin.file:
    path: /var/lib/mcp-lunchmoney/build
    state: directory
    mode: "0755"

- name: Install lunchmoney MCP build context
  register: mcp_lunchmoney_build_context
  ansible.builtin.copy:
    src: build/
    dest: /var/lib/mcp-lunchmoney/build/
    mode: "0644"

- name: Build lunchmoney MCP image
  containers.podman.podman_image:
    name: localhost/mcp-lunchmoney:latest
    state: build
    path: /var/lib/mcp-lunchmoney/build
    force: "{{ mcp_proxy_build_context.changed or mcp_lunchmoney_build_context.changed }}"

- name: Expose Lunch Money MCP
  ansible.builtin.include_role:
    name: machines/server/service-mcp-proxy
    apply:
      tags: [mcp, mcp-lunchmoney]
  vars:
    mcp_proxy_name: "lunchmoney-{{ item.name }}"
    mcp_proxy_port: "{{ item.port }}"
    mcp_proxy_image: localhost/mcp-lunchmoney:latest
    mcp_proxy_backend:
      command: /usr/local/bin/lunchmoney-mcp
    mcp_proxy_environment:
      LUNCHMONEY_API_TOKEN: "{{ item.token }}"
    mcp_proxy_allowed_groups: "{{ item.groups }}"
  no_log: true
  loop:
    - name: evan
      port: 9591
      token: "{{ mcp.api_token_evan }}"
      groups: [mcp-admin]
    - name: vivian
      port: 9592
      token: "{{ mcp.api_token_vivian }}"
      groups: [mcp-shared]
