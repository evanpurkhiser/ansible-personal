- name: Ensure MCP proxy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "/etc/mcp-{{ mcp_proxy_name }}"
    - "/var/lib/mcp-{{ mcp_proxy_name }}"

- name: Ensure MCP proxy signing key
  no_log: true
  ansible.builtin.shell:
    cmd: "umask 077; openssl rand -hex 32 > /etc/mcp-{{ mcp_proxy_name }}/signing-key"
    creates: "/etc/mcp-{{ mcp_proxy_name }}/signing-key"

- name: Configure Pocket ID client
  when: not ansible_check_mode
  ansible.builtin.import_tasks: oidc.yml

- name: Install MCP proxy environment
  no_log: true
  register: mcp_proxy_config
  ansible.builtin.template:
    src: environment.j2
    dest: "/etc/mcp-{{ mcp_proxy_name }}/environment"
    mode: "0600"

- name: Ensure Quadlet directory
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Install MCP proxy Quadlet
  register: mcp_proxy_quadlet
  ansible.builtin.template:
    src: mcp-proxy.container.j2
    dest: "/etc/containers/systemd/container-mcp-{{ mcp_proxy_name }}.container"
    mode: "0644"

- name: Ensure MCP proxy is running
  ansible.builtin.systemd:
    name: "container-mcp-{{ mcp_proxy_name }}"
    state: >-
      {{ 'restarted'
         if mcp_proxy_quadlet.changed or mcp_proxy_config.changed or mcp_proxy_image_build.changed
         else 'started' }}
    daemon_reload: true

- name: Ensure MCP nginx directory
  ansible.builtin.file:
    path: /etc/nginx/mcp-services.d
    state: directory
    mode: "0755"

- name: Install MCP nginx configuration
  notify: Reload nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/mcp-services.d/{{ mcp_proxy_name }}.conf"
    mode: "0644"
