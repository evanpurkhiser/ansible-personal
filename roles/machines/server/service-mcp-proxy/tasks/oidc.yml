- name: Read Pocket ID API key
  no_log: true
  register: mcp_proxy_api_key
  ansible.builtin.slurp:
    src: /etc/pocket-id/api-key

- name: Read Pocket ID client
  no_log: true
  register: mcp_proxy_existing_client
  ansible.builtin.uri:
    url: "http://127.0.0.1:1411/api/oidc/clients/{{ mcp_proxy_client.id }}"
    headers:
      X-API-KEY: "{{ mcp_proxy_api_key.content | b64decode | trim }}"
    status_code: [200, 404]

- name: Ensure Pocket ID client
  no_log: true
  when: >-
    mcp_proxy_existing_client.status == 404 or
    mcp_proxy_existing_client.json | dict2items |
    selectattr('key', 'in', mcp_proxy_client.keys()) | items2dict != mcp_proxy_client
  changed_when: true
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:1411/api/oidc/clients{{
      '' if mcp_proxy_existing_client.status == 404 else '/' ~ mcp_proxy_client.id }}
    method: "{{ 'POST' if mcp_proxy_existing_client.status == 404 else 'PUT' }}"
    headers:
      X-API-KEY: "{{ mcp_proxy_api_key.content | b64decode | trim }}"
    body_format: json
    body: "{{ mcp_proxy_client }}"
    status_code: [200, 201]
