- name: Ensure meal-log data directory exists
  ansible.builtin.file:
    path: /var/lib/meal-log
    state: directory
    mode: "0755"

- name: Install meal-log config
  notify: Restart meal-log
  ansible.builtin.copy:
    dest: /etc/meal-log.conf
    mode: "0600"
    content: |
      OPENAI_TOKEN={{ meal_log.openai_token }}
      RECORD_TOKEN={{ meal_log.record_token }}
      R2_ACCOUNT_ID={{ meal_log.r2_account_id }}
      R2_ACCESS_KEY_ID={{ meal_log.r2_access_key_id }}
      R2_SECRET_ACCESS_KEY={{ meal_log.r2_secret_access_key }}
      R2_BUCKET_NAME=meal-log-images

- name: Install meal-log Quadlet
  notify: Restart meal-log
  ansible.builtin.copy:
    src: container-meal-log.container
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure meal-log container is running
  ansible.builtin.systemd:
    name: container-meal-log
    state: started
    daemon_reload: true
