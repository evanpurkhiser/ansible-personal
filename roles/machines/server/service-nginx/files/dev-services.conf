server {
    listen 443 ssl;
    server_name "~^(?<dev_port>(?:[3-9][0-9]{3}|1[0-9]{4}))[.]prk[.]network$";

    ssl_certificate     /var/lib/lego/certificates/prk.network.crt;
    ssl_certificate_key /var/lib/lego/certificates/prk.network.key;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:$dev_port;
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    error_page 502 =502 /dev-service-unavailable.html;

    location = /dev-service-unavailable.html {
        root /usr/share/nginx/html;
        internal;
    }
}
