server {
    listen 443 ssl;
    server_name apis.evanpurkhiser.com;

    location = /deploy-image {
        client_max_body_size 16k;
        proxy_pass http://deploy_image_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /meal-log {
        proxy_pass http://meal_log_backend;
        proxy_request_buffering off;
        rewrite ^/meal-log(?:/(.*))?$ /$1 break;
    }

    location /atuin-abacus {
        proxy_pass http://atuin_abacus_backend;
        proxy_request_buffering off;
        rewrite ^/atuin-abacus(?:/(.*))?$ /$1 break;
    }

    include /etc/nginx/mcp-services.d/*.conf;

    location /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        return 444;
    }
}
