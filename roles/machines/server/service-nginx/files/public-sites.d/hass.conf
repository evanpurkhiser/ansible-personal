server {
    listen 443 ssl;
    server_name hass.evanpurkhiser.com;

    access_log /var/log/nginx/hass-access.log;

    # New sessions are authorized through ha.prk.network. Keep other public
    # routes available for API clients, webhooks, and integration callbacks.
    # Cloudflare translates nginx's connection-closing 444 response into 520,
    # so blocked routes return a valid HTTP response.
    location = /auth/authorize {
        return 404;
    }

    location = /auth/providers {
        return 404;
    }

    location = /auth/login_flow {
        return 404;
    }

    location ^~ /auth/login_flow/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
