- name: Install lego
  community.general.pacman:
    name: lego
    state: present

- name: Ensure lego data directory
  ansible.builtin.file:
    path: /var/lib/lego
    state: directory
    mode: "0700"

- name: Install lego Cloudflare credentials
  ansible.builtin.copy:
    dest: /etc/lego-cloudflare.conf
    content: "CF_DNS_API_TOKEN={{ nginx.cloudflare_dns_api_token }}\n"
    mode: "0600"
  no_log: true

- name: Install nginx certificate deploy hook
  ansible.builtin.copy:
    src: reload-nginx-certificate.sh
    dest: /usr/local/bin/reload-nginx-certificate
    mode: "0755"

- name: Install lego renewal service
  ansible.builtin.copy:
    src: lego-renew.service
    dest: /etc/systemd/system/
    mode: "0644"

- name: Install lego renewal timer
  ansible.builtin.copy:
    src: lego-renew.timer
    dest: /etc/systemd/system/
    mode: "0644"

- name: Check prk.network certificate
  ansible.builtin.stat:
    path: /var/lib/lego/certificates/prk.network.crt
  register: prk_network_certificate

- name: Obtain prk.network certificate
  ansible.builtin.systemd:
    name: lego-renew.service
    state: started
    daemon_reload: true
  when: not prk_network_certificate.stat.exists

- name: Enable lego renewal timer
  ansible.builtin.systemd:
    name: lego-renew.timer
    state: started
    enabled: true
    daemon_reload: true
