- name: Ensure internal nginx configuration directory
  ansible.builtin.file:
    path: /etc/nginx/internal-services.d
    state: directory
    mode: "0755"

- name: Ensure development service proxy
  ansible.builtin.copy:
    src: dev-services.conf
    dest: /etc/nginx/internal-services.d/00-dev.conf
    mode: "0644"
  notify: Reload nginx

- name: Ensure development service unavailable page
  ansible.builtin.copy:
    src: dev-service-unavailable.html
    dest: /usr/share/nginx/html/dev-service-unavailable.html
    mode: "0644"
  notify: Reload nginx

- name: Ensure public nginx site configurations
  ansible.builtin.copy:
    src: public-sites.d/
    dest: /etc/nginx/public-sites.d/
    mode: "0644"
    directory_mode: "0755"
  notify: Reload nginx

- name: Remove obsolete dots site configuration
  ansible.builtin.file:
    path: /etc/nginx/public-sites.d/dots.conf
    state: absent
  notify: Reload nginx

- name: Ensure nginx server configuration
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/
    mode: "0644"
  notify: Reload nginx

- name: Ensure Cloudflare origin cert
  ansible.builtin.copy:
    dest: /etc/ssl/cloudflare_origin.crt
    mode: "0600"
    content: "{{ nginx.cloudflare_cert }}"

- name: Ensure Cloudflare origin key
  ansible.builtin.copy:
    dest: /etc/ssl/cloudflare_origin.key
    mode: "0600"
    content: "{{ nginx.cloudflare_key }}"

- name: Enable nginx server
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
