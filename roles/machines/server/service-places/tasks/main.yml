- name: Ensure Places directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /var/lib/places/data
    - /mnt/documents/backups/places

- name: Install Places configuration
  notify: Restart Places
  no_log: true
  ansible.builtin.template:
    src: places.yaml.j2
    dest: /etc/places.yaml
    mode: "0600"

- name: Install places Quadlets
  notify: Restart Places
  loop:
    - places.pod
    - container-places-postgres.container
    - container-places-server.container
    - container-places-worker.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure places services are running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  loop:
    - pod-places.service
    - container-places-postgres.service
    - container-places-server.service
    - container-places-worker.service

- name: Install Places backup script
  ansible.builtin.copy:
    src: places-backup.sh
    dest: /usr/local/bin/places-backup.sh
    mode: "0755"

- name: Configure Places backup retention
  ansible.builtin.copy:
    src: places-backup-tmpfiles.conf
    dest: /etc/tmpfiles.d/places-backup.conf
    mode: "0644"

- name: Install Places backup service and timer
  ansible.builtin.copy:
    src: "places-backup.{{ item }}"
    dest: "/etc/systemd/system/places-backup.{{ item }}"
    mode: "0644"
  loop: [service, timer]

- name: Enable Places backup timer
  ansible.builtin.systemd:
    name: places-backup.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Expose Places internally
  notify: Reload nginx
  internal_service:
    name: places
    local_port: 5188

- name: Expose Places MCP
  ansible.builtin.import_role:
    name: machines/server/service-mcp-proxy
  vars:
    mcp_proxy_name: places
    mcp_proxy_port: 9597
    mcp_proxy_backend:
      url: http://127.0.0.1:5188/mcp
    mcp_proxy_upstream_units:
      - container-places-server.service
