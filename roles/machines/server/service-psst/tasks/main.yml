- name: Install psst from evanpurkhiser pacman repo
  notify: Restart psst
  community.general.pacman:
    name: psst
    state: latest

- name: Enable psst service
  ansible.builtin.systemd:
    name: psst.service
    state: started
    enabled: true
    daemon_reload: true

- name: Expose psst sharing internally
  notify: Reload nginx
  internal_service:
    name: psst
    local_port: 7337
