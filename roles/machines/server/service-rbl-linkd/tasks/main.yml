- name: Ensure rekordbox library directory
  ansible.builtin.file:
    path: /mnt/documents/multimedia/djing/rekordbox
    state: directory
    owner: evan
    group: users
    mode: "0755"

- name: Install rbl-linkd configuration
  notify: Restart rbl-linkd
  ansible.builtin.copy:
    src: rbl-linkd.toml
    dest: /etc/rbl-linkd.toml
    owner: root
    group: root
    mode: "0644"

- name: Install rbl-linkd Quadlets
  notify: Restart rbl-linkd
  loop:
    - rbl-linkd.network
    - container-rbl-linkd.container
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure rbl-linkd container is running
  ansible.builtin.systemd:
    name: container-rbl-linkd
    state: started
    daemon_reload: true
