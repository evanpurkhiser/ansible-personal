- name: Install weekly-report.sh script
  ansible.builtin.copy:
    src: weekly-report.sh
    dest: /usr/local/bin/
    mode: "0755"

- name: Ensure weekly-report state directory
  ansible.builtin.file:
    path: /home/evan/.local/state/weekly-report/runs
    state: directory
    owner: evan
    group: users
    mode: "0700"

- name: Install weekly-report instructions
  ansible.builtin.copy:
    src: weekly-report.prompt
    dest: /etc/weekly-report.prompt
    mode: "0644"

- name: Install weekly-report timer and service
  notify: Systemd daemon-reload
  with_items: [timer, service]
  ansible.builtin.copy:
    src: weekly-report.{{ item }}
    dest: /etc/systemd/system/
    mode: "0644"

- name: Enable weekly-report timer service
  ansible.builtin.service:
    name: weekly-report.timer
    state: started
    enabled: true
