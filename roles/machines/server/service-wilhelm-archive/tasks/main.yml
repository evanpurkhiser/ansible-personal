- name: Ensure Wilhelm Archive state directory
  ansible.builtin.file:
    path: /var/lib/wilhelm-archive
    state: directory
    owner: evan
    group: users
    mode: "0700"

- name: Install wilhelm-archive Quadlet
  register: wilhelm_archive_quadlet
  ansible.builtin.copy:
    src: container-wilhelm-archive.container
    dest: /etc/containers/systemd/
    mode: "0644"

- name: Ensure Wilhelm Archive is running
  ansible.builtin.systemd:
    name: container-wilhelm-archive
    state: "{{ 'restarted' if wilhelm_archive_quadlet.changed else 'started' }}"
    daemon_reload: true

- name: Expose Wilhelm Archive internally
  notify: Reload nginx
  internal_service:
    name: wilhelm-archive
    domain: astro-vids
    local_port: 9008

- name: Expose Wilhelm Archive MCP
  ansible.builtin.import_role:
    name: machines/server/service-mcp-proxy
  vars:
    mcp_proxy_name: wilhelm-archive
    mcp_proxy_port: 9596
    mcp_proxy_backend:
      url: http://127.0.0.1:9008/mcp
    mcp_proxy_upstream_units:
      - container-wilhelm-archive.service
